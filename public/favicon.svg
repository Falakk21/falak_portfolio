<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="burgundyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A0E17"/>
      <stop offset="100%" stop-color="#2B070C"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA771C"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded diamond / shield -->
  <rect width="100" height="100" rx="22" fill="url(#burgundyGrad)" />
  <rect x="5" y="5" width="90" height="90" rx="18" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.85" />
  
  <!-- Subtle inner decorative diamond -->
  <polygon points="50,14 86,50 50,86 14,50" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.35" />
  
  <!-- Monogram FB -->
  <text x="50" y="60" 
        font-family="'Playfair Display', 'Cinzel', 'Georgia', serif" 
        font-size="34" 
        font-weight="700" 
        fill="url(#goldGrad)" 
        text-anchor="middle" 
        letter-spacing="2">FB</text>
        
  <!-- Small bottom star / diamond accent -->
  <polygon points="50,76 52.5,80 50,84 47.5,80" fill="url(#goldGrad)" />
</svg>